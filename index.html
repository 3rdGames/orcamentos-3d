<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamentos 3D · 3rd Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2f6df0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3rd Games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--bg:#f2f4f8;--cd:#fff;--in:#eef1f6;--tx:#12151c;--mu:#6c7587;--ln:#dfe3eb;--ac:#2f7df0;--nv:rgba(30,33,42,.92);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c10;--cd:#16181f;--in:#20232c;--tx:#f4f6fa;--mu:#9aa1b0;--ln:#2a2d37;--ac:#5aa9ff;--nv:rgba(40,43,52,.85);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0c10;--cd:#16181f;--in:#20232c;--tx:#f4f6fa;--mu:#9aa1b0;--ln:#2a2d37;--ac:#5aa9ff;--nv:rgba(40,43,52,.85);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:120px}
main{max-width:640px;margin:0 auto}
.hd{background:linear-gradient(135deg,#6cc0ff,#2f6df0);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 22px 26px;border-radius:0 0 32px 32px}
.hd .tp{display:flex;justify-content:space-between;align-items:center;gap:12px}.hd .tp span{font-size:22px;font-weight:800;text-align:center;line-height:1.1;flex-shrink:0}
.hd small{font-size:18px;opacity:.92;letter-spacing:.04em}.hd b{display:block;font-size:48px;margin-top:6px}.hd .s{opacity:.88;font-size:14px}
.top{padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 4px}.top h1{margin:0;font-size:34px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:18px;margin:14px 16px}
.cd h2{margin:0 0 8px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
h2 button.l{background:none;border:0;color:var(--ac);padding:0;font-size:17px;text-transform:none;letter-spacing:0}
label{display:block;color:var(--mu);margin:12px 0 6px;font-size:16px}
input,select{width:100%;background:var(--in);color:var(--tx);border:0;border-radius:14px;padding:14px;font-size:18px;font-family:inherit}
.u{position:relative}.u i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mu);font-style:normal}.u input{padding-right:48px}
.sm{color:var(--mu);font-size:14px;margin-top:8px}
.it{border-top:1px solid var(--ln);margin-top:10px;padding-top:2px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--ln)}.row.t{font-weight:700;border:0}
.opt{border:2px solid var(--ln);border-radius:16px;padding:12px 14px;margin-top:10px;cursor:pointer}.opt.on{border-color:var(--ac)}
.opt small{color:var(--mu);font-size:14px}.opt b{display:block;font-size:26px;color:var(--ac)}
button{font-family:inherit;cursor:pointer}
.bt{background:var(--ac);color:#fff;border:0;border-radius:16px;padding:16px;font-size:18px;width:100%;font-weight:600}
.rm{background:var(--in);color:var(--tx);border:0;border-radius:12px;padding:10px 14px;margin-top:10px;font-size:15px}
.bt svg{width:22px;height:22px;vertical-align:-4px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bt.gh{background:#2a2d37;margin-top:10px}
.bs{display:flex;gap:8px;margin-top:12px}.bs button{flex:1;font-size:16px;padding:12px}
nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:612px;margin:auto;display:flex;background:var(--nv);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:34px;padding:8px;z-index:5}
nav button{flex:1;background:none;color:#fff;border:0;border-radius:26px;padding:8px 2px;font-size:12px}nav button svg{display:block;margin:0 auto 3px;width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button.on{background:rgba(255,255,255,.2)}
</style>
</head>
<body>
<main>
<section id="s0"></section><section id="s1" hidden></section><section id="s2" hidden></section><section id="s3" hidden></section>
</main>
<nav><button id="n0"><svg viewBox="0 0 24 24"><path d="M14 4c-2 0-3 1-3.4 3L9 16c-.4 2-1.4 3-3.6 3M7 10h6M15 10l5 6M20 10l-5 6"/></svg>Calcular</button><button id="n1"><svg viewBox="0 0 24 24"><path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1 2h6l1-2h5"/></svg>Orçamentos</button><button id="n2"><svg viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2M7 14h10v7H7z"/></svg>Impressora</button><button id="n3"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Perfil</button></nav>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=[['Bambu Lab A1 Mini',80],['Bambu Lab A1',120],['Bambu Lab P1S',105],['Bambu Lab X1C',105],['Creality Ender 3 / V2',120],['Creality Ender 3 S1 Pro',130],['Prusa MK3S+',105],['Prusa MK4',105],['Voron 2.4',250]];
const MATS=['PLA','PLA+','PETG','ABS','ASA','TPU','Outro'];
let last={};
let S={pf:{neg:'',wa:'',imp:0,kwh:1.34,moeda:'BRL'},pr:P.map(p=>({n:p[0],w:p[1],v:2000,vida:2000})),c:{nome:'',h:0,imp:0,qtd:1,falha:5,mg:20,m1:3,m2:5,met:0,fil:[{m:'PLA',p:0,g:0}],ex:[]},orc:[]};
try{const d=JSON.parse(localStorage.getItem('c3d'));if(d)S=Object.assign(S,d)}catch(e){}
const R=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{style:'currency',currency:S.pf.moeda});
const save=()=>{try{localStorage.setItem('c3d',JSON.stringify(S))}catch(e){}};
const gp=p=>p.split('.').reduce((o,k)=>o&&o[k],S);
const sp=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
const F=(l,k,u,t)=>{t=t||'number';return `<label>${l}</label><div class="u"><input data-k="${k}" type="${t}" ${t=='number'?'inputmode="decimal" step="any" min="0"':''}>${u?`<i>${u}</i>`:''}</div>`};
function bind(r){r.querySelectorAll('[data-k]').forEach(e=>{const v=gp(e.dataset.k);e.value=v==null?'':v;e.oninput=e.onchange=()=>{let v=e.value;if(e.type=='number'||e.dataset.n)v=parseFloat(v)||0;sp(e.dataset.k,v);calc()}})}

const SV='<svg viewBox="0 0 24 24"><path d="M5 3h11l4 4v14H5zM8 3v6h8V3M8 21v-7h8v7"/></svg>';
const LP='<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';
$('s0').innerHTML=`<div class="hd"><div class="tp"><div><small>Preço por unidade</small><b id="big"></b><div class="s" id="sub"></div></div><span>3rd Games<br>Orçamentos 3D</span></div></div>
<div class="cd"><h2>Produto</h2>${F('Nome do produto','c.nome','','text')}${F('Quantidade de peças','c.qtd','un')}</div>
<div class="cd"><h2>Impressão</h2>${F('Tempo de impressão','c.h','h')}<label>Impressora</label><select class="psel" data-n="1" data-k="c.imp"></select><div class="sm" id="amo"></div></div>
<div class="cd"><h2>Filamentos<button class="l" id="aF">+ Adicionar</button></h2><div id="fil"></div></div>
<div class="cd"><h2>Custos extras<button class="l" id="aE">+ Adicionar</button></h2><div class="sm">Chaveiro, ímã, embalagem… entram no subtotal.</div><div id="ex"></div></div>
<div class="cd"><h2>Precificação</h2>${F('Falhas / desperdício','c.falha','%')}${F('Margem de lucro','c.mg','%')}${F('Markup A','c.m1','x')}${F('Markup B','c.m2','x')}</div>
<div class="cd"><h2>Custo de produção</h2><div id="cu"></div></div>
<div class="cd"><h2>Preço sugerido por unidade</h2><div class="sm">Toque para escolher qual aparece no topo.</div><div id="opts"></div></div>
<div style="padding:0 16px"><button class="bt" id="sv">${SV} Salvar orçamento</button><button class="bt gh" id="lp">${LP} Limpar tela</button></div>`;
$('s1').innerHTML=`<div class="top"><h1>Orçamentos</h1></div><div id="lo"></div>`;
$('s2').innerHTML=`<div class="top"><h1>Impressora</h1></div><div id="pl"></div><div style="padding:0 16px"><button class="bt" id="aP">+ Adicionar impressora</button></div><div class="sm" style="padding:10px 22px">Consumos médios estimados imprimindo PLA. Amortização = valor ÷ vida útil.</div>`;
$('s3').innerHTML=`<div class="top"><h1>Perfil</h1></div>
<div class="cd"><h2>Negócio</h2>${F('Nome do negócio','pf.neg','','text')}${F('WhatsApp (com DDD)','pf.wa','','tel')}</div>
<div class="cd"><h2>Padrões</h2><label>Impressora padrão</label><select class="psel" id="pfimp" data-n="1" data-k="pf.imp"></select>
<label>Valor da impressora</label><div class="u"><input id="pfv" type="number" inputmode="decimal" step="any" min="0"><i>R$</i></div>${F('Preço de energia (kWh)','pf.kwh','R$')}
<div class="sm">Usado para calcular a amortização por hora (valor ÷ vida útil estimada) e a energia.</div></div>
<div class="cd"><h2>Moeda</h2><select id="moe" data-k="pf.moeda"><option value="BRL">BRL — Real brasileiro</option><option value="USD">USD — Dólar americano</option><option value="EUR">EUR — Euro</option></select></div>`;

function fillSel(){document.querySelectorAll('.psel').forEach(s=>s.innerHTML=S.pr.map((p,i)=>`<option value="${i}">${esc(p.n)}</option>`).join(''))}
function dFil(){$('fil').innerHTML=S.c.fil.map((f,i)=>`<div class="it"><label>Material</label><select data-k="c.fil.${i}.m">${MATS.map(m=>`<option>${m}</option>`).join('')}</select>${F('Preço carretel (1kg)',`c.fil.${i}.p`,'R$')}${F('Gramas usadas',`c.fil.${i}.g`,'g')}${S.c.fil.length>1?`<button class="rm" data-d="c.fil" data-i="${i}">Remover</button>`:''}</div>`).join('')}
function dEx(){$('ex').innerHTML=S.c.ex.map((x,i)=>`<div class="it">${F('Nome',`c.ex.${i}.n`,'','text')}${F('Preço',`c.ex.${i}.p`,'R$')}<button class="rm" data-d="c.ex" data-i="${i}">Remover</button></div>`).join('')}
function dPr(){$('pl').innerHTML=S.pr.map((p,i)=>`<div class="cd">${F('Modelo',`pr.${i}.n`,'','text')}${F('Consumo médio',`pr.${i}.w`,'W')}${F('Valor da impressora',`pr.${i}.v`,'R$')}${F('Vida útil estimada',`pr.${i}.vida`,'h')}<div class="sm" data-am="${i}"></div>${S.pr.length>1?`<button class="rm" data-d="pr" data-i="${i}">Remover</button>`:''}</div>`).join('')}
function dO(){const l=$('lo');if(!S.orc.length){l.innerHTML='<div class="cd sm">Nenhum orçamento salvo ainda. Monte um na aba Calcular e toque em “Salvar orçamento”.</div>';return}
l.innerHTML=S.orc.map(o=>`<div class="cd"><b style="font-size:19px">${esc(o.c.nome||'Sem nome')}</b>${S.pf.neg?`<div class="sm">${esc(S.pf.neg)}</div>`:''}<div class="sm">${esc(o.d)} · ${esc(o.pn)} · ${o.c.h} h · ${o.q} un</div><div class="row" style="margin-top:8px"><span>Custo do lote</span><span>${R(o.custo)}</span></div>${o.o.map(x=>`<div class="row"><span>${esc(x[0])}</span><span><b>${R(x[1]/o.q)}</b> /un</span></div>`).join('')}<div class="bs"><button class="bt" data-a="o" data-id="${o.id}">Abrir</button><button class="rm" style="margin:0" data-a="x" data-id="${o.id}">Excluir</button></div></div>`).join('')}

function calc(){const c=S.c,p=S.pr[c.imp]||S.pr[0],q=Math.max(1,c.qtd||1);
const am=p.v/(p.vida||1),en=p.w/1000*S.pf.kwh,fil=c.fil.reduce((s,f)=>s+f.g/1000*f.p,0),ex=c.ex.reduce((s,e)=>s+(+e.p||0),0);
const mq=c.h*am,me=c.h*en,base=mq+me+fil+ex,fal=base*c.falha/100,custo=base+fal;
const o=[['Margem de '+c.mg+'%',custo/(1-Math.min(c.mg,95)/100)],['Markup '+c.m1+'x',custo*c.m1],['Markup '+c.m2+'x',custo*c.m2]];
const sel=o[c.met]||o[0];
$('big').textContent=R(sel[1]/q);$('sub').textContent='Lote: '+R(sel[1])+' · lucro '+R(sel[1]-custo);
$('amo').textContent='Amortização ≈ '+R(am)+'/h · consumo '+p.w+'W';
document.querySelectorAll('[data-am]').forEach(e=>{const z=S.pr[e.dataset.am];e.textContent='Amortização ≈ '+R(z.v/(z.vida||1))+'/h'});
$('cu').innerHTML=[['Amortização da impressora',mq],['Energia',me],['Filamentos',fil],['Custos extras',ex],['Falhas',fal]].map(r=>`<div class="row"><span>${r[0]}</span><span>${R(r[1])}</span></div>`).join('')+`<div class="row t"><span>Custo total</span><span>${R(custo)}</span></div>`;
$('opts').innerHTML=o.map((x,i)=>`<div class="opt${i==c.met?' on':''}" data-i="${i}"><small>${x[0]}</small><b>${R(x[1]/q)}</b><div class="sm">lote ${R(x[1])} · lucro ${R(x[1]-custo)} · margem real ${x[1]?((x[1]-custo)/x[1]*100).toFixed(1):0}%</div></div>`).join('');
last={custo,q,o};save()}

function drawAll(){fillSel();dFil();dEx();dPr();bind($('s0'));bind($('s2'));bind($('s3'));$('pfv').value=(S.pr[S.pf.imp]||S.pr[0]).v;calc();dO()}
function show(i){[0,1,2,3].forEach(k=>{$('s'+k).hidden=k!=i;$('n'+k).className=k==i?'on':''});fillSel();bind($('s0'));bind($('s3'));$('pfv').value=(S.pr[S.pf.imp]||S.pr[0]).v;window.scrollTo(0,0)}
[0,1,2,3].forEach(k=>$('n'+k).onclick=()=>show(k));
$('aF').onclick=()=>{S.c.fil.push({m:'PLA',p:0,g:0});drawAll()};
$('aE').onclick=()=>{S.c.ex.push({n:'',p:0});drawAll()};
$('aP').onclick=()=>{S.pr.push({n:'Minha impressora',w:100,v:2000,vida:2000});drawAll()};
$('pfv').oninput=e=>{(S.pr[S.pf.imp]||S.pr[0]).v=parseFloat(e.target.value)||0;calc()};
$('sv').onclick=()=>{calc();S.orc.unshift({id:Date.now(),d:new Date().toLocaleString('pt-BR'),c:JSON.parse(JSON.stringify(S.c)),pn:(S.pr[S.c.imp]||S.pr[0]).n,custo:last.custo,q:last.q,o:last.o});save();dO();const b=$('sv');b.textContent='✓ Orçamento salvo';setTimeout(()=>b.innerHTML=SV+' Salvar orçamento',1800)};
$('s1').onclick=e=>{const b=e.target.closest('button');if(!b)return;const o=S.orc.find(x=>x.id==b.dataset.id);if(!o)return;
if(b.dataset.a=='o'){S.c=JSON.parse(JSON.stringify(o.c));const i=S.pr.findIndex(p=>p.n==o.pn);S.c.imp=i<0?0:i;drawAll();show(0)}
else if(!b.dataset.c){b.dataset.c=1;b.textContent='Confirmar exclusão'}
else{S.orc=S.orc.filter(x=>x!=o);save();dO()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b){gp(b.dataset.d).splice(+b.dataset.i,1);if(b.dataset.d=='pr'){S.pf.imp=0;S.c.imp=0}drawAll();return}
const t=e.target.closest('.opt');if(t){S.c.met=+t.dataset.i;calc()}});
$('lp').onclick=()=>{S.c=Object.assign({},S.c,{nome:'',h:0,qtd:1,fil:[{m:'PLA',p:0,g:0}],ex:[]});drawAll();window.scrollTo(0,0)};
drawAll();show(0);
$('pfimp').addEventListener('change',()=>{S.c.imp=S.pf.imp;drawAll()});
$('moe').addEventListener('change',()=>{calc();dO()});
</script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body>
</html>
